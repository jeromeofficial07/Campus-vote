<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#401f2a"/>
      <stop offset="55%" stop-color="#5D3140"/>
      <stop offset="100%" stop-color="#2c1119"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CF4173" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#CF4173" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F39399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F39399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <circle cx="300" cy="150" r="380" fill="url(#glow1)"/>
  <circle cx="1350" cy="850" r="420" fill="url(#glow2)"/>

  <!-- Stars -->
  <g fill="#F6D8BD" opacity="0.35">
