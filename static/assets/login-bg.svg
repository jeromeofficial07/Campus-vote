    <path d="M 90 40 C 140 -10, 120 -90, 50 -110 C 70 -60, 60 -10, 20 20" />
    <path d="M -85 20 L -60 30 M -78 -5 L -52 8 M -68 -30 L -44 -15 M -55 -55 L -34 -38 M -38 -78 L -22 -58" />
    <path d="M 85 20 L 60 30 M 78 -5 L 52 8 M 68 -30 L 44 -15 M 55 -55 L 34 -38 M 38 -78 L 22 -58" />
  </g>

  <!-- Grand hall columns silhouette along the bottom -->
  <g fill="#2c1119" opacity="0.55">
