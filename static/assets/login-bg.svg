  <!-- Ballot box icon, subtle, lower right -->
  <g transform="translate(1230,470)" opacity="0.14" fill="none" stroke="#F6D8BD" stroke-width="4">
    <rect x="0" y="40" width="140" height="90" rx="6"/>
    <polygon points="-10,40 150,40 130,10 10,10"/>
    <line x1="50" y1="10" x2="35" y2="-25"/>
    <line x1="90" y1="10" x2="105" y2="-25"/>
