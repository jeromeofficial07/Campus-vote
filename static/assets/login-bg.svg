    <circle cx="260" cy="180" r="1.5"/>
    <circle cx="410" cy="60" r="2"/>
    <circle cx="600" cy="130" r="1.5"/>
    <circle cx="780" cy="70" r="2"/>
    <circle cx="950" cy="160" r="1.5"/>
    <circle cx="1120" cy="90" r="2"/>
    <circle cx="1300" cy="150" r="1.5"/>
    <circle cx="1480" cy="80" r="2"/>
    <circle cx="80" cy="300" r="1.5"/>
