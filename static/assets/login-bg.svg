    <polygon points="0,760 1600,760 1600,700 0,700"/>
    <polygon points="750,620 800,560 850,620" />
  </g>
  <g fill="#1f0c12" opacity="0.6">
    <rect x="60"  y="640" width="46" height="200"/>
    <rect x="180" y="640" width="46" height="200"/>
    <rect x="300" y="640" width="46" height="200"/>
    <rect x="420" y="640" width="46" height="200"/>
    <rect x="1134" y="640" width="46" height="200"/>
    <rect x="1254" y="640" width="46" height="200"/>
    <rect x="1374" y="640" width="46" height="200"/>
    <rect x="1494" y="640" width="46" height="200"/>
    <rect x="700" y="620" width="200" height="10"/>
